services:
  - type: web
    name: securevault
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn securevault.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: securevault-db
          property: connectionString

databases:
  - name: securevault-db
    databaseName: securevault
    user: securevault

venv/
__pycache__/
*.pyc
db.sqlite3
staticfiles/
.env
